# Actions are pinned to commit SHAs; without this they never get bumped.
# The cooldown matches minimumReleaseAge in pnpm-workspace.yaml: nothing
# younger than seven days is proposed. Security updates skip the cooldown.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: chore(ci)

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      dev:
        dependency-type: development
    commit-message:
      prefix: chore(deps)
