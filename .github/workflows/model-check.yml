name: Model Check

# Dogfoods the action in this repository: the models the README leads with
# must stay current. Weekly, so a sunset announced on a quiet week still
# surfaces. Not on pull requests: the action runs the published npm package,
# so a change to `doctor` here is only exercised once it is released.

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Check the models the README leads with
        uses: ./
        with:
          models: |
            opus
            sonnet
            haiku
            gpt6
            gemini-flash
            grok
