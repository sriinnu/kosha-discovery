name: Manual Release (Tag + npm)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Signed git tag to release (example: v0.6.0)"
        required: true
        type: string
      publish_npm:
        description: "Publish @sriinnu/kosha-discovery to npm"
        required: false
        default: true
        type: boolean
      create_github_release:
        description: "Create/update GitHub Release for this tag"
        required: false
        default: true
        type: boolean
      publish_mcp:
        description: "Publish kosha-mcp to the MCP registry (io.github.sriinnu/kosha-discovery)"
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag }}
          fetch-depth: 0

      - name: Ensure tag exists and is reachable
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse "${{ github.event.inputs.tag }}^{tag}" >/dev/null

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag }}"
          VERSION_FROM_TAG="${TAG#v}"
          VERSION_FROM_PKG="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          if [[ "$VERSION_FROM_TAG" != "$VERSION_FROM_PKG" ]]; then
            echo "Tag version ($VERSION_FROM_TAG) does not match package.json version ($VERSION_FROM_PKG)."
            exit 1
          fi

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm test

      # npm trusted publishing (OIDC) needs npm >= 11.5; Node 22 bundles 10.x.
      # With a trusted publisher configured on npmjs.com for this repo +
      # workflow file, `npm publish` authenticates via the job's id-token and
      # NPM_TOKEN is not needed at all. A still-valid NPM_TOKEN keeps working
      # as before; an expired one is ignored when unset.
      - name: Upgrade npm for trusted publishing
        if: ${{ github.event.inputs.publish_npm == 'true' }}
        run: npm install -g npm@latest && npm --version

      - name: Publish to npm
        if: ${{ github.event.inputs.publish_npm == 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

      # The MCP registry verifies npm ownership by reading `mcpName` out of the
      # PUBLISHED package.json and matching it against server.json's `name`, so
      # this has to run after the npm publish above. Auth is the job's own OIDC
      # token — the `io.github.sriinnu/*` namespace is proved by the repo owner,
      # so there is no interactive login and no secret to rotate.
      - name: Publish to the MCP registry
        if: ${{ github.event.inputs.publish_mcp == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) ASSET=mcp-publisher_linux_amd64.tar.gz ;;
            aarch64|arm64) ASSET=mcp-publisher_linux_arm64.tar.gz ;;
            *) echo "unsupported runner arch: $(uname -m)" >&2; exit 1 ;;
          esac
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/${ASSET}" \
            -o /tmp/mcp-publisher.tar.gz
          tar -xzf /tmp/mcp-publisher.tar.gz -C /tmp mcp-publisher
          chmod +x /tmp/mcp-publisher
          # server.json pins its own version; fail loudly rather than publishing
          # a manifest that points at a different release than the tag.
          node -e '
            const fs = require("node:fs");
            const srv = JSON.parse(fs.readFileSync("server.json", "utf8"));
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const tag = process.env.RELEASE_TAG.replace(/^v/, "");
            const seen = [srv.version, srv.packages[0].version, pkg.version];
            if (seen.some((v) => v !== tag)) {
              throw new Error(`version mismatch: tag ${tag} vs ${seen.join(", ")}`);
            }
            if (pkg.mcpName !== srv.name) {
              throw new Error(`mcpName ${pkg.mcpName} does not match server name ${srv.name}`);
            }
          '
          /tmp/mcp-publisher login github-oidc
          /tmp/mcp-publisher publish
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          RELEASE_TAG: ${{ github.event.inputs.tag }}

      - name: Create GitHub release
        if: ${{ github.event.inputs.create_github_release == 'true' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag }}
          generate_release_notes: true
