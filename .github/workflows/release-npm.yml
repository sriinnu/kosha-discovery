name: Manual Release (Tag + npm)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Signed git tag to release (example: v0.6.0)"
        required: true
        type: string
      publish_npm:
        description: "Publish @sriinnu/kosha-discovery to npm"
        required: false
        default: true
        type: boolean
      create_github_release:
        description: "Create/update GitHub Release for this tag"
        required: false
        default: true
        type: boolean
      publish_mcp:
        description: "Publish kosha-mcp to the MCP registry (io.github.sriinnu/kosha-discovery)"
        required: false
        default: true
        type: boolean

# Each job asks for what it needs. Only `publish-npm` can mint an npm OIDC
# token, and it runs no code from the repository or its dependencies: it
# publishes the tarball `verify` built.
permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Before anything else touches the input. It reaches `run:` only through
      # env, never through `${{ }}`.
      - name: Validate tag name
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::not a release tag: $TAG"
            exit 1
          fi

      # Fully qualified: an unqualified ref makes actions/checkout prefer a
      # BRANCH of the same name, while every check below resolves the tag. A
      # branch called v1.9.0 would then be built and published under the
      # genuine signed tag v1.9.0.
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      # The tag must be signed by one of the pinned hardware keys and sit on
      # main's history. The signers file is read from main, not from the tag
      # under release, so a tag cannot bring its own key, and main itself only
      # accepts signed commits. A stolen token can push a tag; it cannot sign
      # one.
      - name: Verify the release tag is signed by a release key
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          RELEASE_KEY_FINGERPRINTS: >-
            SHA256:jWV8C3RG95sm64vjVhs1vQj48aFBAsgmlPsCm/5zezw
            SHA256:i+fYPHVViUQmJuoUZtX80b2CZ2WOSO0Z1NNnZZO7cH4
        run: |
          set -euo pipefail
          REF="refs/tags/$TAG"
          git rev-parse "$REF^{tag}" >/dev/null
          git fetch --no-tags --quiet origin main
          SIGNERS="$RUNNER_TEMP/allowed_signers"
          git show origin/main:.github/allowed_signers > "$SIGNERS"
          # `|| [[ -n ... ]]` keeps a last line without a trailing newline: it
          # would still be trusted by verify-tag, so it must be checked here.
          while read -r principal keytype key _comment || [[ -n "${principal:-}" ]]; do
            [[ -z "$principal" || "$principal" == \#* ]] && continue
            fpr="$(printf '%s %s\n' "$keytype" "$key" | ssh-keygen -lf - | awk '{print $2}')"
            if [[ " $RELEASE_KEY_FINGERPRINTS " != *" $fpr "* ]]; then
              echo "::error::allowed_signers carries a key that is not pinned in this workflow ($fpr)"
              exit 1
            fi
          done < "$SIGNERS"
          git -c gpg.format=ssh -c gpg.ssh.allowedSignersFile="$SIGNERS" verify-tag "$REF"
          if ! git merge-base --is-ancestor "$REF^{commit}" origin/main; then
            echo "::error::$TAG does not point at a commit on main"
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse "$REF^{commit}")" ]]; then
            echo "::error::checked-out HEAD is not the commit $TAG points at"
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          version: 10.33.0

      # No dependency cache: a release must not restore a cache written by
      # another workflow.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate tag matches package and server versions
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # server.json pins its own version; fail loudly rather than publishing
          # a manifest that points at a different release than the tag.
          node -e '
            const fs = require("node:fs");
            const srv = JSON.parse(fs.readFileSync("server.json", "utf8"));
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const tag = process.env.TAG.replace(/^v/, "");
            if (pkg.version !== tag) {
              throw new Error(`tag version ${tag} does not match package.json version ${pkg.version}`);
            }
            const seen = [srv.version, srv.packages[0].version];
            if (seen.some((v) => v !== tag)) {
              throw new Error(`version mismatch: tag ${tag} vs server.json ${seen.join(", ")}`);
            }
            if (pkg.mcpName !== srv.name) {
              throw new Error(`mcpName ${pkg.mcpName} does not match server name ${srv.name}`);
            }
          '

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm test

      - name: Pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release"
          npm pack --pack-destination "$RUNNER_TEMP/release"
          cp server.json "$RUNNER_TEMP/release/"

      # Runs the publish job's exact command on the exact tarball, minus the
      # upload, so a broken publish line fails here instead of after the
      # npm-release approval. v1.9.0 died that way: `release/*.tgz` without the
      # ./ was read as GitHub shorthand. No auth is needed for a dry run.
      - name: Rehearse the npm publish
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          shopt -s failglob
          npm publish ./release/*.tgz --access public --dry-run

      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          retention-days: 7

  publish-npm:
    needs: verify
    if: ${{ inputs.publish_npm }}
    runs-on: ubuntu-latest
    # The environment limits this job to `v*` tags and waits for a reviewer.
    # npm's trusted publisher for the package is bound to this environment too,
    # so a run outside it cannot publish even with the workflow file edited.
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # npm trusted publishing (OIDC) needs npm >= 11.5; Node 22 bundles 10.x.
      # Pinned, not @latest: this step runs with the job's id-token in reach.
      # The package's trusted publisher on npmjs.com is this repo, this
      # workflow file and the `npm-release` environment, so `npm publish`
      # authenticates with the job's id-token. There is no NPM_TOKEN any more:
      # a long-lived publish token is exactly what the LiteLLM 1.107.0 stealer
      # harvested, and a run that is not this workflow in this environment has
      # nothing to publish with.
      - name: Upgrade npm for trusted publishing
        run: npm install -g --ignore-scripts npm@11.21.0 && npm --version

      - name: Download release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release
          path: release

      - name: Publish to npm
        shell: bash
        run: |
          set -euo pipefail
          shopt -s failglob
          # The ./ matters: npm reads a bare `release/x.tgz` as GitHub shorthand
          # (owner/repo) and tries to git-clone it. That sank v1.9.0.
          npm publish ./release/*.tgz --access public --provenance

  # Outside the npm-release environment on purpose: its OIDC token carries no
  # environment claim, so the MCP publisher binary cannot publish to npm. It
  # only runs once publish-npm, which a reviewer approved, has succeeded.
  publish-mcp:
    needs: [verify, publish-npm]
    if: ${{ inputs.publish_mcp }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release
          path: release

      # The MCP registry verifies npm ownership by reading `mcpName` out of the
      # PUBLISHED package.json and matching it against server.json's `name`, so
      # this has to run after the npm publish above. Auth is the job's own OIDC
      # token — the `io.github.sriinnu/*` namespace is proved by the repo owner,
      # so there is no interactive login and no secret to rotate.
      - name: Publish to the MCP registry
        shell: bash
        working-directory: release
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          # sha256 of the release assets for MCP_PUBLISHER_VERSION; update both
          # together.
          MCP_PUBLISHER_SHA256_AMD64: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
          MCP_PUBLISHER_SHA256_ARM64: 8dd75a6cf6845688b5d4e46df58d3ca26d5c8d233bb0626606e1db82c5e883e4
          RELEASE_TAG: ${{ inputs.tag }}
          PKG_NAME: "@sriinnu/kosha-discovery"
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) ASSET=mcp-publisher_linux_amd64.tar.gz; SUM="$MCP_PUBLISHER_SHA256_AMD64" ;;
            aarch64|arm64) ASSET=mcp-publisher_linux_arm64.tar.gz; SUM="$MCP_PUBLISHER_SHA256_ARM64" ;;
            *) echo "unsupported runner arch: $(uname -m)" >&2; exit 1 ;;
          esac
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/${ASSET}" \
            -o "$RUNNER_TEMP/mcp-publisher.tar.gz"
          echo "$SUM  $RUNNER_TEMP/mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C "$RUNNER_TEMP" mcp-publisher
          chmod +x "$RUNNER_TEMP/mcp-publisher"
          # The registry resolves the npm version before it will register the
          # manifest, and npm's read API lags its own publish by tens of
          # seconds. On the 1.6.0 release that raced and the step failed with
          # "version '1.6.0' was not found (status: 404)" moments after a
          # successful publish, so wait for the version to actually resolve
          # instead of relying on luck.
          PKG_VERSION="${RELEASE_TAG#v}"
          for attempt in $(seq 1 30); do
            if npm view "${PKG_NAME}@${PKG_VERSION}" version >/dev/null 2>&1; then
              echo "npm has ${PKG_NAME}@${PKG_VERSION} (attempt ${attempt})"
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "::error::${PKG_NAME}@${PKG_VERSION} did not appear on npm within 5 minutes" >&2
              exit 1
            fi
            sleep 10
          done
          "$RUNNER_TEMP/mcp-publisher" login github-oidc
          "$RUNNER_TEMP/mcp-publisher" publish

  github-release:
    needs: [verify, publish-npm]
    # Runs when npm was skipped too, but never after a failed publish.
    if: ${{ !cancelled() && inputs.create_github_release && needs.verify.result == 'success' && needs.publish-npm.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          tag_name: ${{ inputs.tag }}
          generate_release_notes: true
