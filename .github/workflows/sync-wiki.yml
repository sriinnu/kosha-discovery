name: Sync Wiki

# docs/ is the source of truth; the wiki is a browsable mirror of it. This
# regenerates the mirrored pages whenever their sources change on main.
# Pages created in the wiki itself are never overwritten or removed — see
# scripts/build-wiki.mjs for the ownership rules.
#
# Every commit to the wiki is signed, like every commit to this repository.
# The workflow signs with a dedicated ed25519 SSH key held in the
# WIKI_SIGNING_KEY secret, whose public half is registered as a signing key
# on the account the commits are authored as. Without the secret the pages
# are still built, but nothing is pushed — an unsigned commit is not an
# acceptable fallback.

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "SKILL.md"
      - "CHANGELOG.md"
      - "wiki/**"
      - "scripts/build-wiki.mjs"
      - ".github/workflows/sync-wiki.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-wiki
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22

      # GitHub only creates the wiki repository once a first page exists. Until
      # then there is nothing to push to, which is a setup step, not a failure.
      - name: Clone wiki
        id: clone
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          WIKI_DIR="$RUNNER_TEMP/wiki"
          echo "WIKI_DIR=$WIKI_DIR" >> "$GITHUB_ENV"
          if git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" "$WIKI_DIR" 2>/dev/null; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::The wiki has no pages yet. Create the first page at https://github.com/${GITHUB_REPOSITORY}/wiki and re-run this workflow."
          fi

      - name: Build wiki pages
        if: ${{ steps.clone.outputs.ready == 'true' }}
        run: node scripts/build-wiki.mjs "$WIKI_DIR" --repo "$GITHUB_REPOSITORY" --ref main

      - name: Publish
        if: ${{ steps.clone.outputs.ready == 'true' }}
        shell: bash
        env:
          WIKI_SIGNING_KEY: ${{ secrets.WIKI_SIGNING_KEY }}
          # Must be an email verified on the account that holds the signing
          # key, or GitHub shows the commit as unverified.
          COMMIT_NAME: Sriinnu
          COMMIT_EMAIL: hello@srinivas.dev
        run: |
          set -euo pipefail
          cd "$WIKI_DIR"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki already up to date."
            exit 0
          fi
          if [[ -z "${WIKI_SIGNING_KEY:-}" ]]; then
            echo "::warning::WIKI_SIGNING_KEY is not set; the wiki has changes but nothing was pushed, because wiki commits must be signed."
            exit 0
          fi

          KEY_FILE="$RUNNER_TEMP/wiki-signing-key"
          (umask 077 && printf '%s\n' "$WIKI_SIGNING_KEY" > "$KEY_FILE")
          trap 'rm -f "$KEY_FILE"' EXIT

          git -c user.name="$COMMIT_NAME" \
              -c user.email="$COMMIT_EMAIL" \
              -c gpg.format=ssh \
              -c user.signingkey="$KEY_FILE" \
              commit -q -S -m "Sync from ${GITHUB_SHA::7}" -m "Generated by sync-wiki.yml from ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}."
          git push origin HEAD
          echo "Wiki updated from ${GITHUB_SHA::7} (signed)." >> "$GITHUB_STEP_SUMMARY"
