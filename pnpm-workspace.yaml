# A package published to npm less than seven days ago is not installed. The
# LiteLLM 1.107.0 compromise lived on PyPI for under two hours and the
# backdoor ran at install time; a release that is a week old has been looked
# at. `--frozen-lockfile` installs are unaffected; this applies when the
# lockfile is resolved.
minimumReleaseAge: 10080
# One exception, for one security fix: hono 4.13.18 patches GHSA-39q9-qp46-w8xg
# (bodyLimit keeps every body chunk in memory; `kosha serve` uses bodyLimit).
# Published 2026-11-11. Remove this once it is a week old (2026-11-18).
minimumReleaseAgeExclude:
  - hono
